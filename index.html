<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rightly · גלריית מסך הבית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: oklch(0.18 0.012 60);
    --ink-2: oklch(0.32 0.012 60);
    --ink-3: oklch(0.50 0.010 60);
    --ink-4: oklch(0.68 0.008 60);
    --line: oklch(0.18 0.012 60 / 0.08);
    --line-2: oklch(0.18 0.012 60 / 0.14);
    --bg: oklch(0.97 0.008 75);
    --bg-2: oklch(0.94 0.012 75);
    --surface: oklch(1 0 0);
    --accent: oklch(0.62 0.21 28);
    --accent-soft: oklch(0.93 0.06 35);
    --accent-ink: oklch(0.32 0.14 28);
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── Top bar ─── */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px oklch(0.62 0.21 28 / 0.15);
  }
  .brand .sub { color: var(--ink-3); font-weight: 500; font-size: 13px; }
  .counter {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    background: var(--bg-2);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .counter .current { color: var(--ink); font-size: 14px; }
  .counter .sep { color: var(--ink-4); }

  /* ─── Stage (mockup viewer) ─── */
  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    padding: 32px 28px;
    align-items: center;
    justify-items: center;
  }

  .viewer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 520px;
  }

  .viewer-meta {
    text-align: center;
    max-width: 460px;
  }
  .viewer-num {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .viewer-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .viewer-desc {
    font-size: 14px;
    color: var(--ink-3);
    line-height: 1.5;
  }

  /* Phone frame — uses scale() to render mockup at native 420px */
  .phone {
    width: 320px;
    height: 660px;
    background: oklch(0.10 0.012 60);
    border-radius: 48px;
    padding: 10px;
    position: relative;
    box-shadow: 0 30px 60px -20px oklch(0.18 0.012 60 / 0.35), 0 12px 24px -8px oklch(0.18 0.012 60 / 0.18);
    flex-shrink: 0;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 26px;
    background: oklch(0.10 0.012 60);
    border-radius: 14px;
    z-index: 2;
    pointer-events: none;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
  }
  .phone-screen iframe {
    position: absolute;
    top: 0;
    right: 0;
    width: 420px;
    height: 868px;
    border: none;
    background: var(--bg);
    display: block;
    transform: scale(0.7143);
    transform-origin: top right;
  }

  /* For wide multi-variant mockups, swap phone frame for a wide frame */
  .wide-stage {
    width: 100%;
    max-width: 1100px;
    aspect-ratio: 1400 / 1100;
    border: 1px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
    background: #0a0a0a;
    position: relative;
    box-shadow: 0 30px 60px -20px oklch(0.18 0.012 60 / 0.25);
    container-type: inline-size;
  }
  .wide-stage iframe {
    position: absolute;
    top: 0;
    right: 0;
    width: 1400px;
    height: 1100px;
    border: none;
    transform-origin: top right;
    transform: scale(calc(100cqw / 1400));
  }

  /* ─── Nav arrows (large clickable side controls) ─── */
  .nav-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    z-index: 10;
    box-shadow: 0 8px 20px -6px oklch(0.18 0.012 60 / 0.18);
    transition: transform 200ms, background 200ms, color 200ms;
  }
  .nav-arrow:hover { background: var(--ink); color: oklch(0.97 0.008 75); }
  .nav-arrow:active { transform: translateY(-50%) scale(0.94); }
  .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-arrow.prev { right: 24px; }
  .nav-arrow.next { left: 24px; }

  /* ─── Bottom thumbnail strip ─── */
  .thumbs {
    position: sticky;
    bottom: 0;
    background: oklch(1 0 0 / 0.85);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    padding: 14px 28px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: thin;
    align-items: center;
    justify-content: center;
  }
  .thumbs::-webkit-scrollbar { height: 4px; }
  .thumbs::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

  .thumb {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    transition: all 200ms;
    color: var(--ink-2);
    font-family: inherit;
  }
  .thumb:hover { border-color: var(--ink-3); }
  .thumb.active {
    background: var(--ink);
    color: oklch(0.97 0.008 75);
    border-color: var(--ink);
  }
  .thumb .num {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--bg-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-2);
  }
  .thumb.active .num { background: var(--accent); color: oklch(0.97 0.008 75); }
  .thumb .name { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; }

  /* ─── Open fullscreen link ─── */
  .open-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    margin-top: 14px;
    padding: 8px 14px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    text-decoration: none;
    transition: all 200ms;
    background: var(--surface);
  }
  .open-link:hover { background: var(--ink); color: oklch(0.97 0.008 75); border-color: var(--ink); }

  /* Hint about keyboard nav */
  .hint {
    position: fixed;
    top: 78px;
    right: 28px;
    font-size: 11px;
    color: var(--ink-4);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 6px 10px;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 400ms;
  }
  .hint.show { opacity: 1; }
  .hint kbd {
    background: var(--bg-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 10px;
    border: 1px solid var(--line);
  }

  /* Mobile */
  @media (max-width: 720px) {
    .topbar { padding: 14px 18px; }
    .brand .sub { display: none; }
    .stage { padding: 20px 12px; }
    .nav-arrow { width: 44px; height: 44px; }
    .nav-arrow.prev { right: 8px; }
    .nav-arrow.next { left: 8px; }
    .phone { width: 280px; height: 580px; }
    .phone-screen iframe { transform: scale(0.625); }
    .viewer-title { font-size: 20px; }
    .thumbs { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); justify-content: flex-start; }
    .hint { display: none; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Rightly</span>
      <span class="sub">· Home Screen Explorations</span>
    </div>
    <div class="counter">
      <span class="current" id="currentIdx">1</span>
      <span class="sep">/</span>
      <span id="totalIdx">2</span>
    </div>
  </header>

  <button class="nav-arrow prev" id="prevBtn" aria-label="הקודם">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="m12 4-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button class="nav-arrow next" id="nextBtn" aria-label="הבא">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="m8 4 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="hint" id="hint">
    נווט עם <kbd>←</kbd> <kbd>→</kbd>
  </div>

  <main class="stage" id="stage">
    <!-- viewer is rendered here by JS -->
  </main>

  <nav class="thumbs" id="thumbs">
    <!-- thumbs are rendered here by JS -->
  </nav>

  <script>
    // ─── Mockup data — add new entries here ───
    const mockups = [
      {
        num: '01',
        name: 'Anti-Reflex',
        title: 'Home · Anti-Reflex',
        desc: 'גרפיט חמים עם אקצנט קורל — תיק פתוח, בחירת תחום ותיקים אחרונים',
        src: 'mockups/01-home.html',
        type: 'phone',
      },
      {
        num: '02',
        name: '3 גרסאות',
        title: '3 כיוונים מודרניים',
        desc: 'Trust Indigo · Executive Navy · Vibrant Modern — שלוש תפיסות עיצוב על אותו מסך בית',
        src: 'mockups/02-design-variations.html',
        type: 'wide',
      },
    ];

    let current = 0;

    const stage = document.getElementById('stage');
    const thumbs = document.getElementById('thumbs');
    const currentIdx = document.getElementById('currentIdx');
    const totalIdx = document.getElementById('totalIdx');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const hint = document.getElementById('hint');

    totalIdx.textContent = mockups.length;

    function render() {
      const m = mockups[current];
      const frame = m.type === 'wide'
        ? `<div class="wide-stage"><iframe src="${m.src}" loading="lazy"></iframe></div>`
        : `<div class="phone"><div class="phone-screen"><iframe src="${m.src}" loading="lazy" scrolling="no"></iframe></div></div>`;

      stage.innerHTML = `
        <div class="viewer-wrap">
          ${frame}
          <div class="viewer-meta">
            <span class="viewer-num">${m.num}</span>
            <div class="viewer-title">${m.title}</div>
            <div class="viewer-desc">${m.desc}</div>
            <a class="open-link" href="${m.src}" target="_blank">
              פתח במסך מלא
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                <path d="M7 4 4 7M4 4h3v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </div>
      `;

      currentIdx.textContent = current + 1;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === mockups.length - 1;

      // Update URL hash without scrolling
      history.replaceState(null, '', '#' + (current + 1));

      renderThumbs();
    }

    function renderThumbs() {
      thumbs.innerHTML = mockups.map((m, i) => `
        <button class="thumb ${i === current ? 'active' : ''}" data-idx="${i}">
          <span class="num">${m.num}</span>
          <span class="name">${m.name}</span>
        </button>
      `).join('');

      thumbs.querySelectorAll('.thumb').forEach(btn => {
        btn.addEventListener('click', () => {
          current = parseInt(btn.dataset.idx, 10);
          render();
        });
      });

      // Scroll active thumb into view
      const active = thumbs.querySelector('.thumb.active');
      if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    prevBtn.addEventListener('click', () => { if (current > 0) { current--; render(); } });
    nextBtn.addEventListener('click', () => { if (current < mockups.length - 1) { current++; render(); } });

    // Keyboard nav (RTL: ArrowRight = previous)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { if (current > 0) { current--; render(); } }
      else if (e.key === 'ArrowLeft') { if (current < mockups.length - 1) { current++; render(); } }
    });

    // Init from URL hash
    const hash = parseInt(window.location.hash.slice(1), 10);
    if (hash && hash >= 1 && hash <= mockups.length) current = hash - 1;

    render();

    // Show keyboard hint briefly on desktop
    if (window.matchMedia('(min-width: 721px)').matches) {
      setTimeout(() => hint.classList.add('show'), 600);
      setTimeout(() => hint.classList.remove('show'), 4200);
    }
  </script>

</body>
</html>
