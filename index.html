<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>Rightly · גלריית מסך הבית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --ink: oklch(0.18 0.012 60);
    --ink-2: oklch(0.32 0.012 60);
    --ink-3: oklch(0.50 0.010 60);
    --ink-4: oklch(0.68 0.008 60);
    --line: oklch(0.18 0.012 60 / 0.08);
    --line-2: oklch(0.18 0.012 60 / 0.14);
    --bg: oklch(0.97 0.008 75);
    --bg-2: oklch(0.94 0.012 75);
    --surface: oklch(1 0 0);
    --accent: oklch(0.62 0.21 28);
    --accent-soft: oklch(0.93 0.06 35);
    --accent-ink: oklch(0.32 0.14 28);
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overscroll-behavior-y: none;
  }

  /* ─── Top bar ─── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    padding-top: max(16px, env(safe-area-inset-top));
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px oklch(0.62 0.21 28 / 0.15);
  }
  .brand .sub { color: var(--ink-3); font-weight: 500; font-size: 13px; }
  .counter {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    background: var(--bg-2);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .counter .current { color: var(--ink); font-size: 14px; }
  .counter .sep { color: var(--ink-4); }

  /* ─── Stage (mockup viewer) ─── */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 28px 28px 16px;
    touch-action: pan-y;
    min-height: calc(100dvh - 120px);
  }

  .viewer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
  }

  .viewer-meta {
    text-align: center;
    max-width: 460px;
  }
  .viewer-num {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .viewer-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .viewer-desc {
    font-size: 13.5px;
    color: var(--ink-3);
    line-height: 1.5;
  }

  /* Gallery card */
  .gallery-card {
    width: 380px;
    height: 900px;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    background: var(--surface);
    box-shadow: 0 12px 48px -12px oklch(0.18 0.012 60 / 0.20), 0 0 0 1px oklch(0.18 0.012 60 / 0.06);
    flex-shrink: 0;
    container-type: inline-size;
  }
  .gallery-card iframe {
    position: absolute;
    top: 0;
    right: 0;
    width: 420px;
    height: 1400px;
    border: none;
    background: var(--surface);
    display: block;
    transform: scale(calc(100cqw / 420));
    transform-origin: top right;
  }

  /* Wide multi-variant frame */
  .wide-stage {
    width: 100%;
    max-width: 1100px;
    aspect-ratio: 1400 / 1100;
    border: 1px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
    background: #0a0a0a;
    position: relative;
    box-shadow: 0 30px 60px -20px oklch(0.18 0.012 60 / 0.25);
    container-type: inline-size;
  }
  .wide-stage iframe {
    position: absolute;
    top: 0;
    right: 0;
    width: 1400px;
    height: 1100px;
    border: none;
    transform-origin: top right;
    transform: scale(calc(100cqw / 1400));
  }

  /* ─── Inline arrows (always-visible row beside the phone) ─── */
  .frame-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    justify-content: center;
  }
  .nav-arrow {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    box-shadow: 0 8px 20px -6px oklch(0.18 0.012 60 / 0.18);
    transition: transform 200ms, background 200ms, color 200ms, opacity 200ms;
    flex-shrink: 0;
    font-family: inherit;
  }
  .nav-arrow:hover { background: var(--ink); color: oklch(0.97 0.008 75); }
  .nav-arrow:active { transform: scale(0.94); }
  .nav-arrow:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ─── Bottom thumbnail strip ─── */
  .thumbs-wrap {
    position: sticky;
    bottom: 0;
    background: oklch(1 0 0 / 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .thumbs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    align-items: center;
    padding: 12px 20px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .thumbs::-webkit-scrollbar { display: none; }

  .thumb {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    transition: all 200ms;
    color: var(--ink-2);
    font-family: inherit;
    scroll-snap-align: center;
  }
  .thumb:hover { border-color: var(--ink-3); }
  .thumb.active {
    background: var(--ink);
    color: oklch(0.97 0.008 75);
    border-color: var(--ink);
  }
  .thumb .num {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--bg-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-2);
  }
  .thumb.active .num { background: var(--accent); color: oklch(0.97 0.008 75); }
  .thumb .name { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }

  .open-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    margin-top: 14px;
    padding: 8px 14px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    text-decoration: none;
    transition: all 200ms;
    background: var(--surface);
  }
  .open-link:hover { background: var(--ink); color: oklch(0.97 0.008 75); border-color: var(--ink); }

  /* Slide animation */
  .viewer-wrap {
    animation: slideIn 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── Mobile ─── */
  @media (max-width: 720px) {
    .topbar { padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); }
    .brand .sub { display: none; }
    .stage { padding: 18px 12px 12px; gap: 16px; }
    .frame-row { gap: 8px; }
    .nav-arrow { width: 40px; height: 40px; }
    .nav-arrow svg { width: 16px; height: 16px; }

    /* Gallery card scales to viewport */
    .gallery-card {
      width: min(320px, calc(100vw - 100px));
      height: min(720px, 72vh);
      border-radius: 20px;
    }

    .viewer-title { font-size: 18px; }
    .viewer-desc { font-size: 12.5px; }
    .viewer-num { font-size: 10px; padding: 3px 9px; }

    /* Wide-stage takes most of the screen on mobile, content scrolls inside */
    .wide-stage {
      aspect-ratio: auto;
      height: calc(100dvh - 240px);
      max-height: 70vh;
    }
    .wide-stage iframe {
      width: 100%;
      height: 100%;
      transform: none;
      position: relative;
    }

    .thumbs { padding: 10px 14px; gap: 6px; }
    .thumb { padding: 7px 12px 7px 8px; }
    .thumb .name { font-size: 11.5px; }
    .thumb .num { width: 20px; height: 20px; font-size: 10px; }

    .open-link { margin-top: 10px; padding: 7px 12px; font-size: 11.5px; }
  }

  /* Very small phones */
  @media (max-width: 380px) {
    .gallery-card {
      width: min(260px, calc(100vw - 90px));
      height: min(600px, 65vh);
    }
    .nav-arrow { width: 36px; height: 36px; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Rightly</span>
      <span class="sub">· Home Screen Explorations</span>
    </div>
    <div class="counter">
      <span class="current" id="currentIdx">1</span>
      <span class="sep">/</span>
      <span id="totalIdx">2</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <!-- viewer is rendered here by JS -->
  </main>

  <div class="thumbs-wrap">
    <nav class="thumbs" id="thumbs"></nav>
  </div>

  <script>
    const mockups = [
      {
        num: '01',
        name: 'Anti-Reflex',
        title: 'Home · Anti-Reflex',
        desc: 'גרפיט חמים עם אקצנט קורל — תיק פתוח, בחירת תחום ותיקים אחרונים',
        src: 'mockups/01-home.html',
        type: 'phone',
      },
      {
        num: '02',
        name: '3 גרסאות',
        title: '3 כיוונים מודרניים',
        desc: 'Trust Indigo · Executive Navy · Vibrant Modern — שלוש תפיסות עיצוב על אותו מסך בית',
        src: 'mockups/02-design-variations.html',
        type: 'wide',
      },
      {
        num: '03',
        name: 'Editorial',
        title: 'Editorial · תדע מה שמגיע לך',
        desc: 'גישה עיתונאית עם Fraunces — צבעים חמים, צורות אסימטריות וכרטיסים בגדלים שונים',
        src: 'mockups/03-rightly-editorial.html',
        type: 'phone',
      },
      {
        num: '04',
        name: 'Editorial Premium',
        title: 'Editorial Premium · זית וקרם',
        desc: 'פלטת זית-קרם-ענבר עם Playfair Display — גלאסמורפיזם, כרטיסי אסטרטגיה ומסגרת טלפון',
        src: 'mockups/04-editorial-premium.html',
        type: 'wide',
      },
      {
        num: '05',
        name: '4 כיוונים',
        title: '4 כיוונים אסתטיים',
        desc: 'Dark Futurist · Editorial Magazine · Organic Warm · Brutal Minimal — ארבע תפיסות קיצוניות על אותו מסך',
        src: 'mockups/05-four-directions.html',
        type: 'wide',
      },
      {
        num: '06',
        name: 'בהיר פרימיום',
        title: 'בהיר ופרימיום · Light Premium',
        desc: 'קרם חם עם Fraunces, glassmorphism עדין, כרטיס AI זית-ענבר ופירוט אסטרטגיית עיצוב',
        src: 'mockups/06-light-premium.html',
        type: 'wide',
      },
      {
        num: '07',
        name: 'Final Premium',
        title: 'Final · המבנה שלך באיכות פרימיום',
        desc: 'אותו מבנה — לוגו, כותרת, 3 כרטיסים — עם 5 שיפורי איכות: Fraunces, gradient icons, צללים מרובדים ואווטאר ממותג',
        src: 'mockups/07-final-premium.html',
        type: 'wide',
      },
      {
        num: '08',
        name: 'Split',
        title: 'Split · תלמיד / עובד',
        desc: 'מסך מחולק לשניים — חצי בהיר לתלמיד, חצי כהה לעובד, עם אנימציית hover ותיק פתוח מהבהב',
        src: 'mockups/08-split.html',
        type: 'phone',
      },
      {
        num: '09',
        name: 'Two Doors',
        title: 'Two Doors · שתי דלתות',
        desc: 'שני כרטיסים זה לצד זה עם תגיות נושא, תיקים אחרונים וכפתור פתיחת תיק חדש',
        src: 'mockups/09-two-doors.html',
        type: 'phone',
      },
      {
        num: '10',
        name: 'בהיר פרימיום · טלפון',
        title: 'Light Premium · מסך טלפון',
        desc: 'קרם חם עם Fraunces, כרטיס AI זית-ענבר, glassmorphism עדין ו-micro-data — גרסת טלפון נקייה',
        src: 'mockups/10-light-premium-phone.html',
        type: 'phone',
      },
    ];

    let current = 0;

    const stage = document.getElementById('stage');
    const thumbs = document.getElementById('thumbs');
    const currentIdx = document.getElementById('currentIdx');
    const totalIdx = document.getElementById('totalIdx');

    totalIdx.textContent = mockups.length;

    function go(idx) {
      if (idx < 0 || idx >= mockups.length) return;
      current = idx;
      render();
    }

    function render() {
      const m = mockups[current];
      const frame = m.type === 'wide'
        ? `<div class="wide-stage"><iframe src="${m.src}" loading="lazy"></iframe></div>`
        : `<div class="gallery-card"><iframe src="${m.src}" loading="lazy"></iframe></div>`;

      stage.innerHTML = `
        <div class="viewer-wrap">
          <div class="frame-row">
            <button class="nav-arrow" id="prevBtn" aria-label="הקודם" ${current === 0 ? 'disabled' : ''}>
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                <path d="m12 4-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            ${frame}
            <button class="nav-arrow" id="nextBtn" aria-label="הבא" ${current === mockups.length - 1 ? 'disabled' : ''}>
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                <path d="m8 4 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="viewer-meta">
            <span class="viewer-num">${m.num}</span>
            <div class="viewer-title">${m.title}</div>
            <div class="viewer-desc">${m.desc}</div>
            <a class="open-link" href="${m.src}" target="_blank">
              פתח במסך מלא
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                <path d="M7 4 4 7M4 4h3v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </div>
      `;

      currentIdx.textContent = current + 1;
      history.replaceState(null, '', '#' + (current + 1));

      document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
      document.getElementById('nextBtn').addEventListener('click', () => go(current + 1));

      renderThumbs();
    }

    function renderThumbs() {
      thumbs.innerHTML = mockups.map((m, i) => `
        <button class="thumb ${i === current ? 'active' : ''}" data-idx="${i}">
          <span class="num">${m.num}</span>
          <span class="name">${m.name}</span>
        </button>
      `).join('');

      thumbs.querySelectorAll('.thumb').forEach(btn => {
        btn.addEventListener('click', () => go(parseInt(btn.dataset.idx, 10)));
      });

      const active = thumbs.querySelector('.thumb.active');
      if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // Keyboard nav (RTL: ArrowRight = previous)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') go(current - 1);
      else if (e.key === 'ArrowLeft') go(current + 1);
    });

    // Touch swipe nav
    let touchStartX = 0, touchStartY = 0, touchActive = false;
    stage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchActive = true;
    }, { passive: true });
    stage.addEventListener('touchend', (e) => {
      if (!touchActive) return;
      touchActive = false;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      // Horizontal swipe with low vertical component
      if (Math.abs(dx) > 50 && Math.abs(dy) < 60) {
        // RTL: swipe right = previous, swipe left = next
        if (dx > 0) go(current - 1);
        else go(current + 1);
      }
    }, { passive: true });

    // Init from URL hash
    const hash = parseInt(window.location.hash.slice(1), 10);
    if (hash && hash >= 1 && hash <= mockups.length) current = hash - 1;

    render();
  </script>

</body>
</html>
