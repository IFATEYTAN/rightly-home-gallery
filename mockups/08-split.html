<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rightly · Split</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --ink: oklch(0.16 0.012 220);
    --ink-2: oklch(0.40 0.010 220);
    --ink-3: oklch(0.62 0.008 220);

    --school-bg: oklch(0.96 0.025 200);
    --school-deep: oklch(0.40 0.10 210);
    --school-accent: oklch(0.55 0.10 200);

    --work-bg: oklch(0.20 0.04 220);
    --work-fg: oklch(0.97 0.008 200);
    --work-accent: oklch(0.78 0.13 195);
  }

  html, body { height: 100%; }
  body {
    font-family: 'Heebo', -apple-system, sans-serif;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    background: oklch(0.95 0.005 200);
  }

  .device {
    max-width: 420px;
    margin: 0 auto;
    height: 100vh;
    min-height: 760px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Floating top bar over both halves */
  .top {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 14px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--ink);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
  }
  .me-pill {
    background: oklch(1 0 0 / 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid oklch(0 0 0 / 0.08);
    padding: 6px 12px 6px 6px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .me-pill .dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--school-accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }

  /* The two equal halves */
  .half {
    flex: 1;
    padding: 0 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: flex 380ms cubic-bezier(0.22, 1, 0.36, 1);
    border: none;
    text-align: right;
    font-family: inherit;
  }
  .half:hover { flex: 1.08; }
  .half:active { transform: scale(0.99); }

  .school {
    background: var(--school-bg);
    color: var(--ink);
    padding-top: 88px;
  }
  .work {
    background: var(--work-bg);
    color: var(--work-fg);
    padding-bottom: 32px;
  }

  /* Section number */
  .num {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .num::after {
    content: '';
    flex: 1;
    height: 1px;
    background: currentColor;
    opacity: 0.3;
    max-width: 60px;
  }

  /* Big icon */
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  .school .icon {
    background: oklch(1 0 0);
    color: var(--school-deep);
    box-shadow: 0 4px 16px oklch(0.40 0.10 210 / 0.12);
  }
  .work .icon {
    background: oklch(1 0 0 / 0.1);
    color: var(--work-accent);
  }

  /* Title */
  .title {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 10px;
  }

  /* Description */
  .desc {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 22px;
    max-width: 30ch;
    opacity: 0.75;
  }

  /* Action row */
  .action {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .school .action { color: var(--school-deep); }
  .work .action { color: var(--work-accent); }
  .action-arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .school .action-arrow {
    background: var(--school-deep);
    color: white;
  }
  .work .action-arrow {
    background: var(--work-accent);
    color: var(--work-bg);
  }
  .half:hover .action-arrow { transform: translateX(-4px); }

  /* The center divider with brand */
  .divider {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    background: oklch(1 0 0);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    box-shadow: 0 4px 16px oklch(0 0 0 / 0.12);
    pointer-events: none;
  }

  /* Continue indicator on the relevant half */
  .continue-tag {
    position: absolute;
    top: 88px;
    left: 26px;
    background: var(--school-deep);
    color: white;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 12px oklch(0.40 0.10 210 / 0.3);
  }
  .continue-tag::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: oklch(0.78 0.13 195);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Status bar at bottom */
  .footer {
    position: absolute;
    bottom: env(safe-area-inset-bottom);
    left: 0; right: 0;
    z-index: 10;
    padding: 16px 22px;
    background: oklch(1 0 0 / 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid oklch(0 0 0 / 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-text {
    font-size: 11.5px;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .footer-text svg {
    color: var(--school-accent);
  }
  .archive-btn {
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }
  .archive-btn .badge {
    position: absolute;
    top: -4px;
    left: -4px;
    background: oklch(0.62 0.21 28);
    color: white;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid oklch(1 0 0);
  }
</style>
</head>
<body>
  <div class="device">
    <div class="top">
      <div class="brand">
        <div class="brand-mark">R</div>
        <span>Rightly</span>
      </div>
      <div class="me-pill">
        <span>אילון</span>
        <div class="dot">א</div>
      </div>
    </div>

    <!-- TOP HALF: SCHOOL -->
    <button class="half school">
      <div class="continue-tag">
        תיק פתוח · השעיה ל-3 ימים
      </div>

      <div class="num">01 · המערכת הראשונה</div>

      <div class="icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 4 3 9l11 5 11-5-11-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M7 12v4.5c0 1.5 3.5 3 7 3s7-1.5 7-3V12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h2 class="title">תלמיד</h2>
      <p class="desc">זכויות מול בית הספר — מבחנים, השעיות, התאמות, יחס לא הוגן</p>

      <div class="action">
        <span>בדיקת זכויות</span>
        <div class="action-arrow">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9 3.5 5 7l4 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </button>

    <div class="divider">Rightly · 2 מערכות</div>

    <!-- BOTTOM HALF: WORK -->
    <button class="half work">
      <div class="num">02 · המערכת השנייה</div>

      <div class="icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="4" y="9" width="20" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M10 9V7a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <h2 class="title">עובד</h2>
      <p class="desc">זכויות מול המעסיק — שכר, שעות, פיטורים, יחס במקום העבודה</p>

      <div class="action">
        <span>בדיקת זכויות</span>
        <div class="action-arrow">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9 3.5 5 7l4 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </button>

    <div class="footer">
      <div class="footer-text">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1 1.5 3.5v3.4c0 2.5 2 4.6 5 5 3-.4 5-2.5 5-5V3.5L6.5 1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <span>מבוסס על החוק הישראלי</span>
      </div>
      <button class="archive-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 4a1.5 1.5 0 0 1 1.5-1.5h2.5L7.5 4h3A1.5 1.5 0 0 1 12 5.5v5A1.5 1.5 0 0 1 10.5 12h-7A1.5 1.5 0 0 1 2 10.5v-6.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        הארכיון שלי
        <span class="badge">3</span>
      </button>
    </div>
  </div>
</body>
</html>
